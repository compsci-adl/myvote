allowBuilds:
  '@heroui/shared-utils': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 7
blockExoticSubdeps: true
overrides:
  esbuild@<=0.24.2: ^0.25.0
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
minimumReleaseAgeExclude:
  - esbuild@0.25.0
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - sharp@0.35.0
