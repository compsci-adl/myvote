allowBuilds:
  '@heroui/shared-utils': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAge: 7
blockExoticSubdeps: true
overrides:
  brace-expansion@<1.1.16: ^1.1.16
  brace-expansion@>=2.0.0 <2.1.2: ^2.1.2
  brace-expansion@>=5.0.0 <5.0.8: ^5.0.8
  esbuild@<=0.24.2: ^0.25.0
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
minimumReleaseAgeExclude:
  - esbuild@0.25.0
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - sharp@0.35.0
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
